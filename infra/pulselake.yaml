  BronzeTracesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref LakeDatabase
      TableInput:
        Name: bronze_traces
        Description: Raw accelerometer windows (3 s before - 6.5 s after) around fall candidates
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-10-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${LakeBucket}/bronze/traces/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/bronze/traces/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: { ignore.malformed.json: "true" }
          Columns:
            - { Name: id, Type: string }
            - { Name: owner, Type: string }
            - { Name: profile, Type: string }
            - { Name: ts, Type: bigint }
            - { Name: traceid, Type: string }
            - { Name: trigger, Type: string }
            - { Name: peakg, Type: double }
            - { Name: ming, Type: double }
            - { Name: detected, Type: boolean }
            - { Name: fallconfig, Type: string }
            - { Name: samples, Type: "array<array<double>>" }
            - { Name: ingest_ts, Type: bigint }

  BronzeActionsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref LakeDatabase
      TableInput:
        Name: bronze_actions
        Description: Every action the platform took (push, escalation, command, acknowledgement)
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-10-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${LakeBucket}/bronze/actions/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/bronze/actions/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: { ignore.malformed.json: "true" }
          Columns:
            - { Name: ts, Type: bigint }
            - { Name: action, Type: string }
            - { Name: status, Type: string }
            - { Name: deviceid, Type: string }
            - { Name: owner, Type: string }
            - { Name: alertid, Type: string }
            - { Name: alerttype, Type: string }
            - { Name: ruleid, Type: string }
            - { Name: rulename, Type: string }
            - { Name: target, Type: string }
            - { Name: level, Type: int }
            - { Name: detail, Type: string }
            - { Name: ackms, Type: bigint }

  # Data-quality profile of every ETL run (written by the ETL) -> view gold_data_quality
  DqRunsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref LakeDatabase
      TableInput:
        Name: dq_runs
        Description: Data quality per ETL run and device (received, duplicates, invalid, late, latency)
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-10-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${LakeBucket}/quality/runs/dt=${!dt}/"
        PartitionKeys:
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/quality/runs/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: { ignore.malformed.json: "true" }
          Columns:
            - { Name: run_at, Type: bigint }
            - { Name: mode, Type: string }
            - { Name: device_id, Type: string }
            - { Name: owner, Type: string }
            - { Name: received, Type: bigint }
            - { Name: duplicates, Type: bigint }
            - { Name: invalid, Type: bigint }
            - { Name: late, Type: bigint }
            - { Name: clock_ahead, Type: bigint }
            - { Name: missing_fields, Type: bigint }
            - { Name: avg_latency_ms, Type: double }
            - { Name: quality_pct, Type: double }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Ref ProjectName
      Description: PulseLake analytics - every query capped at 100 MB scanned
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: 104857600
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LakeBucket}/athena-results/"

  # The ETL needs CTAS with its own external_location (silver/), which an enforced
  # workgroup forbids - so it gets its own workgroup with the same 100 MB scan cap.
  EtlWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-etl"
      Description: PulseLake ETL (bronze -> silver -> gold), capped at 500 MB per query (~$0.0025)
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: false
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: 524288000 # raw JSON is scanned whole; a demo day of 4 phones is ~60 MB
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LakeBucket}/athena-results/etl/"

  AnalyticsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: analytics-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem]
                Resource: [!GetAtt DevicesTable.Arn, !GetAtt AlertsTable.Arn]
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults,
                         athena:StopQueryExecution]
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetTable, glue:GetTables, glue:GetPartition, glue:GetPartitions]
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${LakeDatabase}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${LakeDatabase}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt LakeBucket.Arn, !Sub "${LakeBucket.Arn}/*"]
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${LakeBucket.Arn}/athena-results/*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt LakeEtlFunction.Arn
                  - !GetAtt FleetSimulatorFunction.Arn
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-action-dispatcher"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-rule-runner"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-accuracy-lab"
              # v3 platform: rules, responders, zones, lab labels (the analytics role stays read-only on the lake)
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                         dynamodb:Scan, dynamodb:BatchGetItem]
                Resource: !GetAtt PlatformTable.Arn
              - Effect: Allow
                Action: dynamodb:BatchGetItem
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow # speed layer read (Lambda architecture panel)
                Action: dynamodb:Query
                Resource: !GetAtt SpeedTable.Arn
              - Effect: Allow # UNLOAD of Gold reports for download (expire after 1 day)
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${LakeBucket.Arn}/exports/*"
              # rules compiler: user rules become part of the IoT Rule SQL
              - Effect: Allow
                Action: [iot:GetTopicRule, iot:ReplaceTopicRule]
                Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}_telemetry_alerts"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt IotRuleRole.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/etl-status"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/sim-status"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/phase"
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/sim-status"
              - Effect: Allow
                Action: budgets:ViewBudget
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/pulselake-total-cap"
              - Effect: Allow
                Action: freetier:GetAccountPlanState
                Resource: "*"

  # ================================================================== PHASE 4: silver / gold ETL
  EtlStatusParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/etl-status"
      Type: String
      Value: '{"state":"NEVER_RUN"}'

  LakeEtlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: lake-etl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults,
                         athena:StopQueryExecution]
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${EtlWorkGroup}"
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetTable, glue:GetTables, glue:GetPartition, glue:GetPartitions,
                         glue:CreateTable, glue:UpdateTable, glue:DeleteTable, glue:BatchCreatePartition,
                         glue:CreatePartition, glue:BatchDeletePartition, glue:DeletePartition]
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${LakeDatabase}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${LakeDatabase}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation, s3:ListBucketMultipartUploads,
                         s3:ListMultipartUploadParts, s3:AbortMultipartUpload]
                Resource: [!GetAtt LakeBucket.Arn, !Sub "${LakeBucket.Arn}/*"]
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: [!Sub "${LakeBucket.Arn}/silver/*", !Sub "${LakeBucket.Arn}/athena-results/*",
                           !Sub "${LakeBucket.Arn}/quality/*"]
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/etl-status"

  LakeEtlLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-lake-etl"
      RetentionInDays: 7

  LakeEtlFunction:
    Type: AWS::Lambda::Function
    DependsOn: LakeEtlLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-lake-etl"
      Runtime: python3.12
      Handler: app.handler
      Code: ../backend/lake_etl
      Role: !GetAtt LakeEtlRole.Arn
      Timeout: 180
      MemorySize: 256
      Environment:
        Variables:
          ATHENA_WORKGROUP: !Ref EtlWorkGroup
          GLUE_DATABASE: !Ref LakeDatabase
          LAKE_BUCKET: !Ref LakeBucket
          ETL_STATUS_PARAM: !Ref EtlStatusParameter

  # Hourly ETL (skips itself when no new data arrived -> no Athena cost while idle)
  EtlSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-etl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LakeEtlFunction.Arn

  EtlSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-hourly-etl"
      Description: Bronze -> Silver -> Gold every hour when there is new data
      ScheduleExpression: rate(1 hour)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt LakeEtlFunction.Arn
        RoleArn: !GetAtt EtlSchedulerRole.Arn
        Input: '{"trigger":"schedule"}'
        RetryPolicy: { MaximumRetryAttempts: 0 }

  # ================================================================== PHASE 5: virtual fleet (scalability test)
  SimStatusParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/sim-status"
      Type: String
      Value: '{"state":"NEVER_RUN"}'

  FleetSimulatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fleet-simulator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: "*"
              - Effect: Allow
                Action: iot:Publish
                Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pulselake/devices/SIM_*/telemetry"
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/sim-status"
              - Effect: Allow # backfill mode: labelled synthetic history straight into Bronze
                Action: s3:PutObject
                Resource:
                  - !Sub "${LakeBucket.Arn}/bronze/telemetry/*"
                  - !Sub "${LakeBucket.Arn}/bronze/events/*"

  FleetSimulatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-fleet-simulator"
      RetentionInDays: 7

  FleetSimulatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: FleetSimulatorLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-fleet-simulator"
      Runtime: python3.12
      Handler: app.handler
      Code: ../backend/fleet_simulator
      Role: !GetAtt FleetSimulatorRole.Arn
      Timeout: 180 # max run is 120 s
      MemorySize: 512
      Environment:
        Variables:
          SIM_STATUS_PARAM: !Ref SimStatusParameter
          LAKE_BUCKET: !Ref LakeBucket

  FleetSimulatorInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref FleetSimulatorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0 # never re-run a load test automatically

  AnalyticsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-analytics-api"
      RetentionInDays: 7

  AnalyticsFunction:
    Type: AWS::Lambda::Function
    DependsOn: AnalyticsLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-analytics-api"
      Runtime: python3.12
      Handler: app.handler
      Code: ../backend/analytics_api
      Role: !GetAtt AnalyticsRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DEVICES_TABLE: !Ref DevicesTable
          ALERTS_TABLE: !Ref AlertsTable
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
          GLUE_DATABASE: !Ref LakeDatabase
          LAKE_BUCKET: !Ref LakeBucket
          ETL_FUNCTION: !Ref LakeEtlFunction
          ETL_STATUS_PARAM: !Ref EtlStatusParameter
          SIM_FUNCTION: !Ref FleetSimulatorFunction
          SIM_STATUS_PARAM: !Ref SimStatusParameter
          PHASE_PARAM: !Ref PhaseParameter
          PLATFORM_TABLE: !Ref PlatformTable
          DISPATCHER_FUNCTION: !Sub "${ProjectName}-action-dispatcher"
          RULE_RUNNER_FUNCTION: !Sub "${ProjectName}-rule-runner"
          ACCURACY_LAB_FUNCTION: !Sub "${ProjectName}-accuracy-lab"
          TELEMETRY_RULE_NAME: !Sub "${ProjectName}_telemetry_alerts"
          SPEED_TABLE: !Ref SpeedTable

  AnalyticsUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AnalyticsFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, authorization]
        MaxAge: 3600

  AnalyticsUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyticsFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Since Oct 2025 public function URLs also need InvokeFunction (restricted to URL calls).
  AnalyticsUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyticsFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ================================================================== v3: ACT - rules, actions, escalation
  # Action dispatcher (Node.js): Web Push to responders, Step Functions escalation, device commands,
  # email; every action is logged to the lake (bronze/actions) and to MQTT pulselake/actions.
  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: action-dispatcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:BatchGetItem]
                Resource: !GetAtt PlatformTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt AlertsTable.Arn
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-escalation"
              - Effect: Allow # task-token callbacks have no resource type
                Action: [states:SendTaskSuccess, states:SendTaskFailure]
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${LakeBucket.Arn}/bronze/actions/*"
              - Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: "*"
              - Effect: Allow
                Action: iot:Publish
                Resource:
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pulselake/actions"
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pulselake/alerts"
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pulselake/devices/*/commands"
              - Effect: Allow # VAPID keys for Web Push (SecureString created by scripts/deploy.ps1)
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/vapid"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" }

  DispatcherLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-action-dispatcher"
      RetentionInDays: 7

  DispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: DispatcherLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-action-dispatcher"
      Runtime: nodejs22.x
      Handler: index.handler
      Code: ../.build/lambda/action_dispatcher # bundled by scripts/build-lambdas.mjs
      Role: !GetAtt DispatcherRole.Arn
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          PLATFORM_TABLE: !Ref PlatformTable
          ALERTS_TABLE: !Ref AlertsTable
          LAKE_BUCKET: !Ref LakeBucket
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-escalation"
          ALERT_TOPIC_ARN: !Ref AlertTopic
          VAPID_PARAM: !Sub "/${ProjectName}/vapid"
          WEB_URL: !Sub "https://${WebDistribution.DomainName}"

  DispatcherInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref DispatcherFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0 # never send the same notification twice
      MaximumEventAgeInSeconds: 120

  # Escalation workflow: notify level 1 and WAIT for "I'm handling it" (task token); after 60 s
  # escalate to level 2 + email; after 120 s more mark the alert UNANSWERED.
  EscalationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-dispatcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DispatcherFunction.Arn

  EscalationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-escalation"
      StateMachineType: STANDARD
      RoleArn: !GetAtt EscalationRole.Arn
      DefinitionSubstitutions:
        Dispatcher: !GetAtt DispatcherFunction.Arn
      Definition:
        Comment: PulseLake escalation - notify, wait for an acknowledgement, escalate, give up
        StartAt: NotifyLevel1
        States:
          NotifyLevel1:
            Type: Task
            Comment: Push to the level-1 responders, then wait for someone to tap "I'm handling it"
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName: ${Dispatcher}
              Payload:
                mode: escalation-notify
                level: 1
                token.$: $$.Task.Token
                alert.$: $.alert
            TimeoutSeconds: 60
            ResultPath: $.answer
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.level1
                Next: NotifyLevel2
            Next: Handled
          NotifyLevel2:
            Type: Task
            Comment: Nobody answered in 60 s - alert every responder + email
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName: ${Dispatcher}
              Payload:
                mode: escalation-notify
                level: 2
                token.$: $$.Task.Token
                alert.$: $.alert
            TimeoutSeconds: 120
            ResultPath: $.answer
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.level2
                Next: MarkUnanswered
            Next: Handled
          MarkUnanswered:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${Dispatcher}
              Payload:
                mode: escalation-unanswered
                alert.$: $.alert
            ResultPath: $.unanswered
            Next: NobodyAnswered
          NobodyAnswered:
            Type: Fail
            Error: Unanswered
            Cause: No responder acknowledged the alert within 3 minutes
          Handled:
            Type: Succeed

  # Rule runner: absence rules (no movement, no data, battery) + lake rules (Athena) every minute
  RuleRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rule-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt PlatformTable.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: [!GetAtt AlertProcessorFunction.Arn, !GetAtt DispatcherFunction.Arn]
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults,
                         athena:StopQueryExecution]
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetTable, glue:GetTables, glue:GetPartition, glue:GetPartitions]
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${LakeDatabase}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${LakeDatabase}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt LakeBucket.Arn, !Sub "${LakeBucket.Arn}/*"]
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${LakeBucket.Arn}/athena-results/*"

  RuleRunnerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-rule-runner"
      RetentionInDays: 7

  RuleRunnerFunction:
    Type: AWS::Lambda::Function
    DependsOn: RuleRunnerLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-rule-runner"
      Runtime: python3.12
      Handler: app.handler
      Code: ../backend/rule_runner
      Role: !GetAtt RuleRunnerRole.Arn
      Timeout: 55
      MemorySize: 256
      Environment:
        Variables:
          DEVICES_TABLE: !Ref DevicesTable
          PLATFORM_TABLE: !Ref PlatformTable
          ALERT_FUNCTION: !Ref AlertProcessorFunction
          DISPATCHER_FUNCTION: !Ref DispatcherFunction
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
          GLUE_DATABASE: !Ref LakeDatabase
          LAKE_BUCKET: !Ref LakeBucket

  RuleRunnerSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-rule-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RuleRunnerFunction.Arn

  RuleRunnerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-rule-runner"
      Description: Absence + lake rules every minute (43k invocations/month - Lambda free tier)
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt RuleRunnerFunction.Arn
        RoleArn: !GetAtt RuleRunnerSchedulerRole.Arn
        Input: '{"trigger":"schedule"}'
        RetryPolicy: { MaximumRetryAttempts: 0 }

  # Accuracy Lab (Node.js): re-runs the phones' own fall detector over labelled traces
  AccuracyLabRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: accuracy-lab
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem]
                Resource: !GetAtt PlatformTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${LakeBucket.Arn}/bronze/traces/*"

  AccuracyLabLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-accuracy-lab"
      RetentionInDays: 7

  AccuracyLabFunction:
    Type: AWS::Lambda::Function
    DependsOn: AccuracyLabLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-accuracy-lab"
      Runtime: nodejs22.x
      Handler: index.handler
      Code: ../.build/lambda/accuracy_lab # bundled with web/src/device/fall.ts
      Role: !GetAtt AccuracyLabRole.Arn
      Timeout: 28
      MemorySize: 1024
      Environment:
        Variables:
          PLATFORM_TABLE: !Ref PlatformTable
          LAKE_BUCKET: !Ref LakeBucket

Outputs:
  AnalyticsUrl:
    Value: !GetAtt AnalyticsUrl.FunctionUrl
  LakeBucketName:
    Value: !Ref LakeBucket
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  GlueDatabaseName:
    Value: !Ref LakeDatabase
  IdentityPoolId:
    Value: !Ref IdentityPool
  GuestRoleName:
    Value: !Ref GuestRole
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  WebUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  KillSwitchFunctionName:
    Value: !Ref KillSwitchFunction
  EscalationStateMachineArn:
    Value: !Ref EscalationStateMachine
  PlatformTableName:
    Value: !Ref PlatformTable
